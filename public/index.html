<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nama Restoran Anda - Pesan Makanan Online & Reservasi</title>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rljxGYsB71f08Xf8SgYj3r4/d/J9D+oK5f1s2+g+p+B8b7Z+qQ7g+r+h+a+g==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    </head>
<body>
    <div id="app">
        <div class="initial-loading-spinner">
            <div class="spinner"></div>
            <p>Memuat aplikasi...</p>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>

    <style>
        /* CSS untuk initial loading spinner (opsional) */
        .initial-loading-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff; /* Latar belakang putih */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Pastikan di atas segalanya */
            font-family: 'Open Sans', sans-serif;
            color: #333;
        }

        .initial-loading-spinner .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #a00; /* Warna primary restoran Anda */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .initial-loading-spinner p {
            margin: 0;
            font-size: 1.1em;
        }

        /* Setelah aplikasi Vue dimuat, sembunyikan spinner ini melalui CSS atau JS di main.js */
        /* Contoh sederhana di main.js:
           document.getElementById('app').style.display = 'block';
           document.querySelector('.initial-loading-spinner').style.display = 'none';
        */
        #app {
            /* Pastikan #app tidak display:none; defaultnya */
            display: none; /* Sembunyikan #app sampai aplikasi Vue siap */
        }
    </style>
</body>
</html>
